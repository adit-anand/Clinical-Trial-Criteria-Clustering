# Optuna search config for `amia_2026/clustering/pacmap_hdbscan_clustering.py`.
#
# search_space entries: {kind: int|float|categorical|int_ratio, low, high,
# choices, log, relative_to}. `int_ratio` suggests a float ratio in
# [low, high] and resolves to max(1, round(ratio * <relative_to's value>)) —
# see min_samples below. Combines PaCMAP's own hyperparameters with
# HDBSCAN's — both are searched jointly. `distance` stays fixed (not
# swept): it's shared by PaCMAP's own fit, HDBSCAN's own fit, DBCV, and the
# dimensionality-reduction fidelity metrics below, and defaults to cosine
# (not euclidean) for this reason.

search_space:
  # PaCMAP's own hyperparameters
  n_components:
    kind: int
    low: 2
    high: 10
  n_neighbors:
    kind: int
    low: 5
    high: 50
  mn_ratio:
    kind: float
    low: 0.1
    high: 1.0
  fp_ratio:
    kind: float
    low: 1.0
    high: 5.0
  # HDBSCAN's own hyperparameters
  min_cluster_size:
    kind: int
    low: 50
    high: 300
  # Swept as a ratio of min_cluster_size (not independently 5-300): letting
  # min_samples land far above min_cluster_size is what HDBSCAN tends to
  # resolve into a degenerate dominant-cluster-or-all-noise result. Note
  # this means the Optuna trial-history CSV records this ratio (0.1-1.0),
  # not the resolved integer min_samples.
  min_samples:
    kind: int_ratio
    low: 0.1
    high: 1.0
    relative_to: min_cluster_size
  cluster_selection_method:
    kind: categorical
    choices: [eom, leaf]

fixed:
  distance: cosine
  # Low-sensitivity HDBSCAN params, held fixed at their library defaults
  # rather than swept: `cluster_selection_epsilon` is forced to 0.0 inside
  # `HDBSCANClusterer` whenever `metric == "cosine"` anyway (see
  # hdbscan_model.py), so sweeping it here was already a no-op dimension.
  cluster_selection_epsilon: 0.0
  alpha: 1.0

# Each trial fits this many seeds x repeats-per-seed before being scored,
# picking the most reproducible seed (see reduction_sweep.py).
reproducibility:
  seeds: [1, 2, 3]
  repeats_per_seed: 5

objective_weights:
  noise_penalty: 1.0
  dominant_cluster_penalty: 1.0
  cluster_count_violation_penalty: 2.0
  micro_cluster_penalty: 1.0
  micro_cluster_size_multiplier: 1.5
  missing_validity_fallback_score: 0.0
  # Dimensionality-reduction fidelity terms (trustworthiness/continuity/
  # steadiness/cohesiveness only — stress is deliberately excluded).
  trustworthiness_weight: 1.0
  continuity_weight: 1.0
  steadiness_weight: 1.0
  cohesiveness_weight: 1.0
  missing_dr_metrics_fallback_score: 0.0
  # BERTopic topic-representation quality terms (all 5 exclude the noise/
  # outlier topic -- noise is already penalized above via noise_penalty).
  # topic_diversity/topic_coherence_npmi/zeroshot_label_confidence/
  # topic_size_entropy are rewards (higher is better, each roughly in
  # [0, 1], except topic_coherence_npmi which is in [-1, 1]);
  # inter_topic_redundancy is a penalty (max pairwise cosine similarity
  # between topic centroids -- high means two topics are near-duplicates).
  topic_diversity_weight: 1.0
  inter_topic_redundancy_penalty: 1.0
  topic_coherence_npmi_weight: 1.0
  zeroshot_label_confidence_weight: 1.0
  topic_size_entropy_weight: 1.0
  missing_bertopic_quality_fallback_score: 0.0

n_trials: 50
sampler_seed: 42

study_dir: data/clustering/pacmap_hdbscan/optuna_studies
results_dir: data/clustering/pacmap_hdbscan
